name: BOOTH-MCP checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: booth-mcp/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: booth-mcp
      - run: node --check booth-mcp/src/index.js
      - run: node --check booth-mcp/src/booth.js
      - run: node --test booth-cookie-sync/test/native-host.test.mjs booth-mcp/test/stdio.test.mjs booth-mcp/tests/item-state.test.js booth-mcp/tests/download.test.js booth-mcp/tests/item-update.test.js
